name: Lion's Cave - checks and GitHub Pages
on:
  push:
    branches: ["interface-nexus", "work/lions-cave-131"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lions-cave-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Fetch pinned licensed pilot model
        run: |
          node scripts/fetch-pilot.mjs
          node scripts/fetch-original-pilot.mjs
      - name: Unit and migration tests
        run: npm test
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint -- --max-warnings=0
      - name: Static production build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_CLOUD_SYNC_ENABLED: "true"
        run: npm run build
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/interface-nexus'
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/interface-nexus'
        with:
          path: ./out
  deploy:
    if: github.ref == 'refs/heads/interface-nexus'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish authorized release
        id: deployment
        uses: actions/deploy-pages@v4
